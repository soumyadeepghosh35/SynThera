name: CI/CD (main to Docker Hub dev)

# Every push to main that changes the image builds it, runs the test suite
# inside that exact image, and only then updates two tags on Docker Hub:
#   soumya35/synthera:dev            moves with main (for developers)
#   soumya35/synthera:dev-previous   the dev image from before the last update
# The release tag (1.0) is published separately by publish-image.yml.
# No latest tag is published on purpose, so users must name a tag.
on:
  push:
    branches: [main]
    # Run only when something that goes into the image (the build context in
    # .dockerignore) changes. Notebooks, data, and markdown files do not.
    paths:
      - "build/**"
      - "executables/**"
      - "tests/**"
      - "external/**"
      - ".github/workflows/ci-cd.yml"
      - "!**/*.md"

env:
  IMAGE: soumya35/synthera

# A newer push to main supersedes a run that is still going.
concurrency:
  group: ci-cd-main
  cancel-in-progress: true

jobs:
  test-build-publish:
    # Native amd64 runner. TensorFlow crashes under QEMU emulation, so do not
    # build on arm64 or under emulation.
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
    steps:
      # Test stage, step 1: get the source.
      - name: Check out repository
        uses: actions/checkout@v4

      # The image is ~18 GB; hosted runners ship with ~14 GB free.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # No tag on Docker Hub is touched until the tests pass (see the Push
      # step below).
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The tests live inside the image (/opt/synthera-app/tests), so the image
      # has to exist before they can run. load: true puts it in the local
      # Docker daemon without pushing it. A failure here stops the job.
      - name: Build image (not pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE }}:dev
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      # Run the suite on the exact image that would be published. Any non-zero
      # exit fails this step, and every later step is skipped, so the publish
      # step cannot run on a failing build.
      - name: Run test suite
        run: |
          docker run --rm --platform linux/amd64 "$IMAGE:dev" \
            bash /opt/synthera-app/tests/run_all_tests.sh

      # Reached only if all earlier steps succeeded. First copy the current dev
      # image to dev-previous on Docker Hub (a registry-side retag, nothing is
      # downloaded), then replace dev. To roll back, retag dev-previous as dev.
      - name: Back up current dev, then push new dev
        run: |
          if docker buildx imagetools inspect "$IMAGE:dev" > /dev/null 2>&1; then
            docker buildx imagetools create -t "$IMAGE:dev-previous" "$IMAGE:dev"
          else
            echo "No existing dev tag, nothing to back up"
          fi
          docker push "$IMAGE:dev"
          docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:dev"
