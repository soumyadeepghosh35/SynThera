# ART run settings
# run as (inside art environment): python runART.py art_config.yaml > art.out

# Input data
baseDataDir: ".."
modelBuildingDataSubdir: "."

# Output folder
outputDir: "ART_results"

# Job label
jobName: "BacillusAnthracisData_allDB"

# Default file names
trainingCsvSuffix: "_wmolformer_ARTready.csv"
artReadyCsvSuffix: "_wmolformer_ARTready.csv"
artModelFileName: "art_molformer.cpkl"

# Optional path overrides
# Use these if your ART-ready CSV filename does not match jobName + artReadyCsvSuffix
inputTrainingCsv: null
artReadyCsv: null
artModelFile: null

# ART inputs
inputFeatureColumnPrefix: "ARTfeat_"
responseColumns:
  - "pPotency"

# Run options
useExistingArtModel: false
saveTrainedArtModel: true
limitTrainingRows: null

# ART parameters
artObjective: "maximize"
artThreshold: 0.2
artAlpha: 0.25
artNumRecommendations: 10
artMaxMcmcCores: 36
artGenerateRecommendations: false
artRunCrossValidation: true
artNumTpotModels: 2
randomSeed: 42
