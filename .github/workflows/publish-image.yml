name: Publish image to Docker Hub

# Runs when a v* tag is pushed. Builds on a native amd64 runner, re-runs the
# test suite on that exact build, and pushes only if the tests pass.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  IMAGE: soumya35/synthera

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Git tag v1.0 is published as Docker tag 1.0
      - name: Set Docker tag
        run: echo "DOCKER_TAG=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # The image is ~18 GB; hosted runners ship with ~14 GB free.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force
          df -h /

      - name: Build image
        run: |
          docker build --platform linux/amd64 \
            --label org.opencontainers.image.revision=$GITHUB_SHA \
            --label org.opencontainers.image.version=${GITHUB_REF_NAME} \
            --label org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY} \
            -f build/Dockerfile -t "$IMAGE:$DOCKER_TAG" .

      - name: Run test suite
        run: |
          docker run --rm --platform linux/amd64 "$IMAGE:$DOCKER_TAG" \
            bash /opt/synthera-app/tests/run_all_tests.sh

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image
        run: |
          docker push "$IMAGE:$DOCKER_TAG"
          docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:$DOCKER_TAG" || true
