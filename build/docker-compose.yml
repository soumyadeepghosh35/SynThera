# Run from inside this build/ directory:  docker compose up --build
services:
  synthera:
    # Forced to amd64 because environment.yml / exptDesigns_environment.yml
    # are build-pinned linux-64 (x86_64) exports - see the matching comment in
    # Dockerfile. On Apple Silicon this runs under emulation (enable "Use
    # Rosetta for x86/amd64 emulation" in Docker Desktop settings for speed).
    platform: linux/amd64
    build:
      context: .              # the build context is build/ only
      # RetroTide, DORAnet, and DORA-XGB are installed automatically at their
      # default (latest) refs - no args needed for them. Uncomment any of
      # these to pin a specific commit/tag, or (once licensed) to install ART
      # into SynThera. See build/DOCKER.md.
      # args:
      #   RETROTIDE_REF: "git+https://github.com/JBEI/RetroTide.git@<commit>"
      #   DORANET_REF: "<commit-or-tag>"
      #   DORAXGB_REF: "git+https://github.com/tyo-nu/DORA_XGB.git@<commit>"
      #   ART_SOURCE: "git+https://github.com/JBEI/AutomatedRecommendationTool.git"
    image: synthera:latest
    container_name: synthera
    ports:
      - "8888:8888"
    volumes:
      # Mount the whole project (the parent of build/) into the container so
      # notebooks, executables, external/ergochemics, and data are all live and
      # edits save back to the host.
      - ..:/opt/synthera
    # Uncomment to run on a GPU host with the NVIDIA container runtime. The
    # SynThera spec pins CUDA builds of torch and tensorflow, so a GPU host is
    # needed to use them; on CPU they install but fall back to CPU execution.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
